name: Build image assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/make_images.py"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render PNG assets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-freefont-ttf >/dev/null
          pip install -q pillow
          python scripts/make_images.py
          ls -la assets/img
      - name: Commit if changed
        run: |
          git add assets/img
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "brand-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: build image assets"
          git pull --rebase origin main && git push
